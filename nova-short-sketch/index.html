<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NOVA motion template</title>
<style>
  @font-face { font-family: GeistV; src: url(fonts/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: Geist; src: url(fonts/Geist-Regular.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Geist; src: url(fonts/Geist-Medium.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: Geist; src: url(fonts/Geist-SemiBold.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: Geist; src: url(fonts/Geist-Bold.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Geist; src: url(fonts/Geist-Black.woff2) format("woff2"); font-weight: 900; }
  @font-face { font-family: Caveat; src: url(fonts/Caveat-Bold.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Caveat; src: url(fonts/Caveat-SemiBold.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: GeistMono; src: url(fonts/GeistMono-Regular.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: GeistMono; src: url(fonts/GeistMono-Medium.woff2) format("woff2"); font-weight: 500; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: min(100vw, 56.25vh); margin: 0 auto; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; font: 13px Geist, sans-serif; color: #ddd; display: flex; gap: 12px; align-items: center; background: rgba(0,0,0,.6); }
  #ui input { flex: 1; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui"><button id="play">play</button><input id="scrub" type="range" min="0" max="20" step="0.001" value="0"><span id="tt">0.00</span></div>
<script src="film.js"></script>
<script>
  // Scrub preview only: the render harness drives NOVA.seek(t) directly.
  (async () => {
    await NOVA.ready;
    const s = document.getElementById('scrub'), tt = document.getElementById('tt');
    let playing = false, t0 = 0, base = 0;
    const show = t => { NOVA.seek(t); s.value = t; tt.textContent = t.toFixed(2); };
    s.oninput = () => { playing = false; show(+s.value); };
    document.getElementById('play').onclick = () => { playing = !playing; t0 = performance.now(); base = +s.value; };
    (function loop() { if (playing) show((base + (performance.now() - t0) / 1000) % NOVA.DUR); requestAnimationFrame(loop); })();
    show(+(new URLSearchParams(location.search).get('t') || 0));
  })();
</script>
</body>
</html>
