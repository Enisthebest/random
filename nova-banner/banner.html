<!doctype html><html><head><meta charset="utf-8"><title>NOVA banner</title>
<style>
@font-face{font-family:GeistV;src:url(../nova-os/fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#000}
.b{position:relative;width:2560px;height:1440px;overflow:hidden;background:#000;font-family:GeistV,sans-serif;color:#fff}
.wall{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 900px 330px at 50% 50%,rgba(0,0,0,.55),rgba(0,0,0,0) 75%)}
/* safe area for all devices: 1546 x 423, centred */
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;justify-content:center;gap:56px}
.star{width:190px;height:190px;object-fit:contain}
.txt{display:flex;flex-direction:column;gap:14px}
.name{font-size:132px;font-weight:700;letter-spacing:.2em;line-height:1;margin-right:-.2em}
.tag{font-size:52px;font-weight:800;letter-spacing:-.03em}
.tag em{font-style:normal;color:rgb(255,174,90)}
.soon{font-size:34px;font-weight:600;color:rgba(255,255,255,.75);letter-spacing:.02em}
</style></head><body><div class="b">
<img class="wall" src="../nova-wallpapers/out/nova-original-4k.png"><div class="shade"></div>
<div class="safe"><img class="star" src="../nova-os/assets/nova-star.png">
<div class="txt"><div class="name">NOVA OS</div><div class="tag">Private. Fast. <em>Yours.</em></div><div class="soon">Coming soon · byeno.org</div></div></div>
</div></body></html>
