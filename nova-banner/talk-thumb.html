<!doctype html><html><head><meta charset="utf-8"><title>We need to talk thumbnail</title>

.talk{position:absolute;left:78px;top:380px;font-size:92px;font-weight:800;letter-spacing:-.04em;line-height:1}

.b2{left:800px;top:250px;transform:rotate(-3deg);opacity:.75}

<div class="t"><div class="glow g1"></div><div class="glow g2"></div>
