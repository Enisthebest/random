<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Images</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Geist",system-ui,sans-serif;color:#f2f2f4;-webkit-font-smoothing:antialiased}
a{color:#6aa8ff}a:hover{color:#9cc4ff}
button{font:inherit;color:inherit}
.frame{position:relative;width:1440px;height:900px;overflow:hidden;background:#050507}
.wall{position:absolute;left:-80px;top:-80px;width:1600px;height:1060px;object-fit:cover;filter:blur(46px) brightness(.5) saturate(1.2)}
.bar{position:absolute;left:0;right:0;top:12px;height:36px;display:flex;justify-content:space-between;padding:0 16px;box-sizing:border-box}
.pill{height:36px;border-radius:12px;background:rgba(16,16,20,.9);border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;padding:0 14px;box-sizing:border-box;font-size:13px;font-weight:600}
.win{position:absolute;left:80px;top:76px;width:1280px;height:776px;border-radius:24px;background:rgba(12,12,16,.9);border:1px solid rgba(255,255,255,.09);box-shadow:0 40px 90px rgba(0,0,0,.55),0 8px 24px rgba(0,0,0,.35);display:flex;overflow:hidden;backdrop-filter:blur(30px)}
.side{width:248px;flex-shrink:0;background:rgba(255,255,255,.025);border-right:1px solid rgba(255,255,255,.06);padding:22px 14px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px}
.app{display:flex;align-items:center;gap:12px;padding:4px 10px 18px}
.app b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8d8d96;padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:11px;font-size:14px;font-weight:500;color:#d6d6db;text-decoration:none;border:0;background:none;text-align:left;width:100%;box-sizing:border-box}
.nav.on{background:rgba(59,139,255,.18);color:#fff}
.nav.on svg{color:#6aa8ff}
.main{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.head{height:76px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid rgba(255,255,255,.06)}
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{font-size:14px;color:#a1a1aa;margin:2px 0 0}
.body{flex-grow:1;padding:24px 32px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:18px 20px;box-sizing:border-box}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8d8d96;margin:0 0 12px}
.row{display:flex;align-items:center;gap:14px;min-height:48px;border-top:1px solid rgba(255,255,255,.05)}
.row:first-of-type{border-top:0}
.rt{flex-grow:1;min-width:0}
.rt b{display:block;font-size:15px;font-weight:600}
.rt span{display:block;font-size:13px;color:#a1a1aa;margin-top:2px}
.ico{width:36px;height:36px;border-radius:11px;background:rgba(59,139,255,.14);color:#6aa8ff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tog{width:46px;height:28px;border-radius:14px;border:0;background:#3a3a40;position:relative;flex-shrink:0;padding:0}
.tog span{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#f4f4f6;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tog.on{background:#2f9e5a}
.tog.on span{left:21px}
.btn{height:40px;padding:0 18px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.pri{background:#f2f2f4;color:#0b0b0e;border-color:#f2f2f4}
.chip{height:28px;padding:0 12px;border-radius:14px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.ok{background:rgba(52,199,89,.16);color:#5fdc86}
.warn{background:rgba(245,146,30,.16);color:#ffae5a}
.blue{background:rgba(59,139,255,.16);color:#8cbcff}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.search{height:40px;width:240px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;padding:0 12px;box-sizing:border-box;color:#a1a1aa;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8d8d96;text-align:left;padding:0 0 10px}
td{padding:11px 0;border-top:1px solid rgba(255,255,255,.05);color:#e4e4e7}
td.m{color:#a1a1aa}
</style>
<div class="frame" style="width: 1440px; height: 900px">

<div class="pill">12:22</div>

<button class="nav on" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"></path> <path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"></path> <circle cx="13" cy="7" r="1" fill="currentColor"></circle> <rect x="8" y="2" width="14" height="14" rx="2"></rect></svg>Library</button><button class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"></path></svg>Favorites</button><button class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"></path> <circle cx="12" cy="13" r="3"></circle></svg>Screenshots</button><div class="sec">Albums</div><button class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect> <circle cx="9" cy="9" r="2"></circle> <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>Wallpapers</button><button class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path> <circle cx="12" cy="10" r="3"></circle></svg>Travel</button><div class="sec">Private</div><button class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path> <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path> <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path> <path d="m2 2 20 20"></path></svg>Hidden</button>
</aside>

ion: 90% 10%; filter: hue-rotate(45deg) saturate(1.1)"></div><div style="aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,.08)"><img src="../assets/wallpaper.png" alt="Photo 9" style="width: 100%; height: 100%; object-fit: cover; object-position: 45% 20%; filter: hue-rotate(-10deg) saturate(1.1)"></div><div style="aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,.08)"><img src="../assets/wallpaper.png" alt="Photo 10" style="width: 100%; height: 100%; object-fit: cover; object-position: 75% 80%; filter: hue-rotate(25deg) saturate(1.1)"></div><div style="aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,.08)"><img src="../assets/wallpaper.png" alt="Photo 11" style="width: 100%; height: 100%; object-fit: cover; object-position: 25% 10%; filter: hue-rotate(0deg) saturate(1.1)"></div><div style="aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,.08)"><img src="../assets/wallpaper.png" alt="Photo 12" style="width: 100%; height: 100%; object-fit: cover; object-position: 55% 90%; filter: hue-rotate(-20deg) saturate(1.1)"></div></div><div class="card" style="display: flex; align-items: center; gap: 14px; padding: 14px 18px"><div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path> <path d="m9 12 2 2 4-4"></path></svg></div><div class="rt"><b>Shared photos leave without location</b><span>Metadata wipe removes place, device and time before anything is shared.</span></div><button class="btn">Manage<
