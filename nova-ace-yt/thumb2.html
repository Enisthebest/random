<!doctype html><html><head><meta charset="utf-8"><title>Meet ACE thumbnail, conversation</title>
<style>
@font-face { font-family: GeistV; src: url(../nova-os/fonts/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; }
html,body{margin:0;background:#000}
#t{position:relative;width:1280px;height:720px;overflow:hidden;background:#030305;font-family:GeistV;color:#fff}
.aura{position:absolute;border-radius:50%;filter:blur(70px)}
.star{position:absolute;left:50%;top:228px;width:250px;height:250px;margin-left:-125px;background:url(../nova-os/assets/nova-star.png) center/contain no-repeat;filter:drop-shadow(0 0 40px rgba(255,255,255,.35))}
.b{position:absolute;padding:22px 30px;border-radius:34px;font-weight:650;font-size:34px;letter-spacing:-.01em;white-space:nowrap;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.me{background:#2f7cf6;border-bottom-right-radius:10px}
.ace{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-bottom-left-radius:10px;backdrop-filter:blur(10px);display:flex;align-items:center;gap:14px}
.ace i{width:30px;height:30px;background:url(../nova-os/assets/nova-star.png) center/contain no-repeat;display:block}
h1{position:absolute;left:0;right:0;bottom:44px;margin:0;text-align:center;font-weight:880;font-size:148px;line-height:1;letter-spacing:-.05em}
h1 span{color:#ffae5a}
.lock{position:absolute;left:50%;top:40px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:12px 24px;border-radius:40px;background:#ececef;color:#111;font-weight:750;font-size:26px}
</style></head><body>
<div id="t">
  <div class="aura" style="left:330px;top:170px;width:420px;height:360px;background:rgba(245,142,30,.55)"></div>
  <div class="aura" style="left:560px;top:150px;width:420px;height:360px;background:rgba(40,120,255,.55)"></div>
  <div class="lock"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Runs on your device</div>
  <div class="star"></div>
  <div class="b me" style="left:70px;top:190px;transform:rotate(-4deg)">Clean up my inbox.</div>
  <div class="b ace" style="left:78px;top:330px;transform:rotate(-2deg)"><i></i>Done. Inbox zero.</div>
  <div class="b me" style="right:70px;top:170px;transform:rotate(4deg)">How hot is my PC?</div>
  <div class="b ace" style="right:64px;top:312px;transform:rotate(2deg)"><i></i>48°C. All good.</div>
  <h1>Meet <span>ACE</span></h1>
</div></body></html>
