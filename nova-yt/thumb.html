<!doctype html><html><head><meta charset="utf-8"><title>Meet NOVA OS thumbnail</title>
<style>
@font-face { font-family: GeistV; src: url(../nova-os/fonts/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; }
html,body{margin:0;background:#000}
#t{position:relative;width:1280px;height:720px;overflow:hidden;background:#000;font-family:GeistV}
#bg{position:absolute;inset:-60px;background:url(../nova-os/assets/wallpaper.png) center/cover;filter:blur(38px) brightness(.62)}
.aura{position:absolute;border-radius:50%;filter:blur(60px)}
#screen{position:absolute;right:-120px;top:150px;width:720px;height:405px;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.14);transform:perspective(1400px) rotateY(-18deg)}
#screen img{width:100%;height:100%;object-fit:cover}
#txt{position:absolute;left:70px;top:150px;color:#fff}
.star{width:84px;height:84px;background:url(../nova-os/assets/nova-star.png) center/contain no-repeat;margin-bottom:18px}
h1{margin:0;font-weight:850;font-size:132px;line-height:.95;letter-spacing:-.045em}
h1 span{color:rgba(255,255,255,.62)}
.pill{display:inline-block;margin-top:34px;padding:12px 26px;border-radius:40px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-weight:700;font-size:30px;letter-spacing:.02em}
</style></head><body>
<div id="t">
  <div id="bg"></div>
  <div class="aura" style="left:-80px;top:180px;width:620px;height:420px;background:rgba(245,142,30,.55)"></div>
  <div class="aura" style="left:320px;top:120px;width:520px;height:420px;background:rgba(40,120,255,.5)"></div>
  <div id="screen"><img src="shot.png"></div>
  <div id="txt"><div class="star"></div><h1>Meet<br><span>NOVA OS</span></h1><div class="pill">Coming soon</div></div>
</div></body></html>
